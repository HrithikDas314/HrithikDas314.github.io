<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hrithik Das | IoT & Robotics · AI</title>
  <meta name="description" content="Portfolio of Hrithik Das: AI, computer vision, RAG systems and IoT.">
  <style>
    :root { --bg:#0a0a0d; --bg2:#13131b; --text:#ececf3; --muted:#9a9aab; --accent:#a855f7; --accent2:#6d28d9; --border:#23232f; --nav:64px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; scroll-padding-top:var(--nav); }
    body { font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(#1c1b2b,#0a0a0d 420px) no-repeat, var(--bg); color:var(--text); line-height:1.65; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 24px; }
    section { padding:90px 0; border-bottom:1px solid var(--border); }
    h2 { text-align:center; font-size:2.3rem; font-weight:400; margin-bottom:56px; }
    h2 span { color:var(--muted); }

    /* navigation */
    nav { position:sticky; top:0; z-index:50; height:var(--nav); background:rgba(10,10,13,.82); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    nav .bar { max-width:1180px; height:100%; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { font-weight:700; font-size:1.1rem; white-space:nowrap; }
    .brand span { color:var(--accent); }
    .links { display:flex; gap:6px; list-style:none; }
    .links a { display:block; padding:7px 13px; border-radius:8px; color:var(--muted); font-size:.92rem; transition:.2s; }
    .links a:hover { color:var(--text); background:#1a1a26; }
    .links a.active { color:#e9d5ff; background:#2a1646; }
    .social { display:flex; gap:14px; align-items:center; }
    .social a img { width:22px; height:22px; filter:invert(1); opacity:.85; transition:.2s; display:block; }
    .social a:hover img { opacity:1; transform:translateY(-2px); }
    .social a.off { pointer-events:none; } .social a.off img { opacity:.3; }
    #burger { display:none; background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; width:40px; height:36px; font-size:1.2rem; cursor:pointer; }

    /* hero */
    .hero { display:grid; grid-template-columns:1.15fr 1fr; gap:40px; align-items:center; padding:70px 0 90px; }
    .hero h1 { font-size:clamp(2.8rem,7vw,5rem); font-weight:300; line-height:1.1; margin-bottom:30px; }
    .role { font-size:clamp(1.3rem,3vw,2rem); font-weight:300; margin-bottom:26px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
    .role .grad { background:linear-gradient(90deg,#c084fc,#6366f1); -webkit-background-clip:text; background-clip:text; color:transparent; transition:opacity .35s; }
    .hero p { color:#cfcfdb; max-width:520px; margin-bottom:28px; }
    .resume { display:inline-block; border:2px solid var(--accent); color:#d8b4fe; padding:10px 20px; border-radius:10px; font-weight:600; transition:.2s; }
    .resume:hover { background:var(--accent); color:#fff; }
    .photo { aspect-ratio:4/5; border-radius:28px; overflow:hidden; background:var(--bg2); border:1px solid var(--border); }
    .photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:var(--muted); background:linear-gradient(135deg,#1a1a26,#241a3a); font-size:.9rem; text-align:center; padding:10px; }
    .ph b { font-size:2.4rem; color:#c084fc; font-weight:300; }

    /* about */
    .about { display:grid; grid-template-columns:1fr 1.3fr; gap:60px; align-items:center; max-width:900px; margin:0 auto; }
    .about .photo { max-width:340px; }
    .about p { color:#cfcfdb; margin-bottom:18px; }

    /* skills */
    .tiles { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }
    .tile { width:92px; height:92px; border:2px solid var(--border); border-radius:20px; background:#101018; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transition:.2s; }
    .tile:hover { transform:translateY(-6px); border-color:var(--accent); }
    .tile img { width:38px; height:38px; }
    .tile small { font-size:.68rem; color:var(--muted); }

    /* experience */
    .exp { max-width:900px; margin:0 auto; }
    .row { display:grid; grid-template-columns:240px 1fr; gap:40px; margin-bottom:46px; }
    .row .when { color:var(--muted); }
    .row h3 { font-size:1.15rem; margin-bottom:6px; }
    .row h3 em { font-style:normal; color:#d8b4fe; }
    .row p { color:var(--muted); }
    .tags { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .tag { background:#4c1d95; color:#e9d5ff; padding:5px 13px; border-radius:6px; font-size:.85rem; font-weight:600; }

    /* publications */
    .pubs { max-width:1000px; margin:0 auto; }
    .pub { display:grid; grid-template-columns:1fr auto; gap:20px; padding:36px 0; border-top:1px solid var(--border); }
    .pub .head { display:flex; align-items:center; gap:12px; color:#c084fc; margin-bottom:14px; }
    .pill { border:1px solid #5b21b6; background:#1e1233; color:#d8b4fe; font-size:.72rem; letter-spacing:1.2px; font-weight:700; padding:6px 14px; border-radius:999px; text-transform:uppercase; }
    .pub h3 { font-size:1.45rem; margin-bottom:10px; }
    .pub .auth { color:var(--muted); margin-bottom:8px; } .pub .auth b { color:var(--text); }
    .pub .venue { color:#7c7c8c; font-style:italic; margin-bottom:12px; }
    .pub .doi { color:#a855f7; font-size:.9rem; }
    .pub .side { display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; }
    .btn { border:1px solid #5b21b6; background:#1a1030; color:#d8b4fe; padding:12px 22px; border-radius:10px; font-weight:600; white-space:nowrap; transition:.2s; }
    .btn:hover { background:var(--accent2); color:#fff; }

    /* projects */
    .projects { max-width:900px; margin:0 auto; }
    .proj { display:grid; grid-template-columns:230px 1fr; gap:44px; align-items:center; margin-bottom:70px; }
    .proj:last-child { margin-bottom:0; }
    .proj .thumb { aspect-ratio:1; border-radius:22px; overflow:hidden; background:var(--bg2); border:1px solid var(--border); }
    .proj .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .proj h3 { font-size:1.35rem; margin-bottom:10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .proj .ic { width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700; background:#a855f7; color:#fff; }
    .proj .ic.live { background:#16a34a; }
    .proj p { color:var(--muted); }

    /* contact */
    .contact { text-align:center; }
    .contact ul { list-style:none; display:flex; flex-direction:column; gap:18px; align-items:center; font-size:1.1rem; }
    .contact a { border-bottom:1px solid #666; }

    footer { text-align:center; color:var(--muted); font-size:.85rem; padding:28px 0; }
    #toTop { position:fixed; right:22px; bottom:22px; width:46px; height:46px; border-radius:50%; border:1px solid #5b21b6; background:#1a1030; color:#d8b4fe; font-size:1.2rem; cursor:pointer; opacity:0; pointer-events:none; transition:.25s; z-index:40; }
    #toTop.show { opacity:1; pointer-events:auto; }
    #toTop:hover { background:var(--accent2); color:#fff; }
    .reveal { opacity:0; transform:translateY(26px); transition:all .7s ease; } .reveal.show { opacity:1; transform:none; }

    @media (max-width:980px) {
      #burger { display:block; }
      .links { position:absolute; top:var(--nav); left:0; right:0; flex-direction:column; background:rgba(10,10,13,.97); border-bottom:1px solid var(--border); padding:10px 24px 16px; display:none; }
      .links.open { display:flex; }
      .links a { padding:11px 12px; }
    }
    @media (max-width:820px) {
      .hero,.about,.row,.proj,.pub { grid-template-columns:1fr; }
      .hero .photo { order:-1; max-width:360px; }
      .pub .side { align-items:flex-start; gap:18px; }
      .proj .thumb { max-width:230px; }
      .social { gap:10px; } .social a img { width:20px; height:20px; }
      nav .bar { padding:0 14px; gap:8px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="bar">
    <a class="brand" href="#top" id="brand"></a>
    <ul class="links" id="links"></ul>
    <div class="social" id="social"></div>
    <button id="burger" aria-label="Menu">☰</button>
  </div>
</nav>

<div class="wrap" id="top">
  <header class="hero">
    <div>
      <h1 id="name"></h1>
      <div class="role"><span id="roleA"></span><span>⇄</span><span class="grad" id="roleB"></span></div>
      <p id="heroText"></p>
      <a class="resume" id="resume" href="#" target="_blank" rel="noopener">⬇ View Resume</a>
    </div>
    <div class="photo" id="heroPhoto"></div>
  </header>
</div>

<section id="about"><div class="wrap reveal">
  <h2>About <span>Me</span></h2>
  <div class="about">
    <div class="photo" id="aboutPhoto"></div>
    <div id="aboutText"></div>
  </div>
</div></section>

<section id="skills"><div class="wrap reveal">
  <h2>Expertises</h2>
  <div class="tiles" id="tiles"></div>
</div></section>

<section id="experience"><div class="wrap reveal">
  <h2>Experience</h2>
  <div class="exp" id="expList"></div>
</div></section>

<section id="publications"><div class="wrap reveal">
  <h2>Publications</h2>
  <div class="pubs" id="pubList"></div>
</div></section>

<section id="projects"><div class="wrap reveal">
  <h2>Projects</h2>
  <div class="projects" id="projectList"></div>
</div></section>

<section id="contact" class="contact"><div class="wrap reveal">
  <h2>Get in Touch</h2>
  <ul id="contactList"></ul>
</div></section>

<footer>© <span id="year"></span> Hrithik Das</footer>
<button id="toTop" aria-label="Back to top">↑</button>

<script>
  // ====== EDIT ======
  // Put images inside an "images" folder in the repository. Missing images show a placeholder.
  const PROFILE = {
    name: "Hrithik Das",
    roleA: "IoT & Robotics Engineer",
    roleB: "AI / ML Developer",
    heroText: "IoT and Robotics Engineering graduate building practical AI systems: computer vision, retrieval-augmented generation and sensor-driven applications for agriculture and climate.",
    heroImage: "images/hero.jpg",
    aboutImage: "images/about.jpg",
    about: [
      "I am an IoT and Robotics Engineering graduate from the University of Frontier Technology, Bangladesh.",
      "My thesis built an AI-based jute leaf disease detection and advisory system that combines deep learning, retrieval-augmented generation and large language models. I also work on IoT and machine learning for agriculture and microclimate forecasting.",
      "Outside engineering, I lead a student organization and take part in youth programmes with UNDP and Futurenation."
    ],
    resume: "resume.pdf"
  };

  const LINKS = {   // paste your profile URLs; empty ones look dimmed
    linkedin:  "https://www.linkedin.com/in/hrithikdas314/",
    github:    "https://github.com/hrithikdas314",
    facebook:  "https://www.facebook.com/badhondas.hrithik/",
    instagram: "https://www.instagram.com/badhon_das_hrithik/",
    x:         "https://x.com/HrithikDas314"
  };

  const SKILLS = [
    ["Python","python/python-original"], ["JavaScript","javascript/javascript-original"],
    ["HTML5","html5/html5-original"], ["CSS3","css3/css3-original"],
    ["FastAPI","fastapi/fastapi-original"], ["TensorFlow","tensorflow/tensorflow-original"],
    ["scikit-learn","scikitlearn/scikitlearn-original"], ["Arduino","arduino/arduino-original"],
    ["C","c/c-original"], ["C++","cplusplus/cplusplus-original"],
    ["Git","git/git-original"], 
  ];

  const EXPERIENCE = [
    { when:"Aug 2026 - Present", role:"Research Assistant", org:"UFTB",
      text:"Collecting and organizing medical data from hospitals for research, with a focus on accuracy and confidentiality.",
      tags:["Data Collection","Research","Teamwork"] },
    { when:"Sep 2025 - Present", role:"Volunteer & Data Enumerator", org:"UNDP / Futurenation",
      text:"Youth-focused programmes aligned with the SDGs; conducted the Tertiary Students' Entrepreneurship Aspiration Survey (Oct 2025).",
      tags:["Survey","Community","Communication"] },
    { when:"Jan 2025 - Present", role:"President", org:"UFTB Sanatani Sangha",
      text:"Leading the student organization and organizing its annual cultural events.",
      tags:["Leadership","Event Management"] },
    { when:"Jul 2023 - Oct 2024", role:"Executive Member", org:"UFTB STEAM Club",
      text:"Helped organize the National STEAM Olympiad and STEM and Arts workshops.",
      tags:["Organizing","Workshops"] }
  ];

  const PUBLICATIONS = [
    { type:"Conference Paper", year:"2025",
      title:"ClimaCare: Explainable IoT-ML Framework for Microclimate Forecasting",
      authors:"",   // e.g. "Avik Halder, Akibul Hasan Anik, <b>Hrithik Das</b>, Saurav Chandra Das"
      venue:"2025 IEEE International Conference on Signal Processing, Information, Communication and Systems (SPICSCON)",
      doi:"",       // e.g. "10.1109/..."
      link:"" }
  ];

  const PROJECTS = [
    { title:"JuteRAG: Jute Leaf Disease Detection with RAG and LLM", image:"images/jute.jpg",
      text:"Thesis project. Detects jute leaf diseases from photos and generates contextual advisories in Bangla using retrieval-augmented generation.",
      tags:["Python","FastAPI","FAISS","RAG","LLM","Computer Vision"], code:"", live:"" },
    { title:"IoT & ML Crop Recommendation", image:"images/crop.jpg",
      text:"Combines soil NPK, moisture, pH and DHT sensors with machine learning to recommend crops for Bangladesh.",
      tags:["IoT","Python","Naive Bayes"], code:"", live:"" },
    { title:"Smart Automated Fire Fighting Robot", image:"images/robot.jpg",
      text:"Autonomous robot that uses sensors and control systems to detect and extinguish fires.",
      tags:["Arduino","Sensors","Robotics"], code:"", live:"" }
  ];

  const CONTACT = {
    location:"Dhaka, Bangladesh",
    email:"hrithikdas314@gmail.com",
    phone:"+880 1678-420790"        // leave empty to keep your number private
  };

  const NAV = [["about","About"],["skills","Skills"],["experience","Experience"],["publications","Publications"],["projects","Projects"],["contact","Contact"]];
  // ====== END EDIT ======

  const $ = id => document.getElementById(id);
  const initials = PROFILE.name.split(" ").map(w => w[0]).join("");

  function img(src, alt) {
    const el = document.createElement("img");
    el.src = src; el.alt = alt;
    el.onerror = () => { el.replaceWith(Object.assign(document.createElement("div"), { className:"ph", innerHTML:`<b>${initials}</b><span>Add image:<br>${src}</span>` })); };
    return el;
  }

  // navigation
  $("brand").innerHTML = PROFILE.name + "<span>.</span>";
  $("links").innerHTML = NAV.map(([id, label]) => `<li><a href="#${id}" data-id="${id}">${label}</a></li>`).join("");
  $("burger").onclick = () => $("links").classList.toggle("open");
  $("links").onclick = e => { if (e.target.tagName === "A") $("links").classList.remove("open"); };

  const SI = "https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/";
  const SOCIAL_NAMES = { linkedin:"LinkedIn", github:"GitHub", facebook:"Facebook", instagram:"Instagram", x:"X (Twitter)" };
  $("social").innerHTML = Object.entries(LINKS).map(([k, u]) =>
    `<a ${u ? `href="${u}" target="_blank" rel="noopener"` : `class="off" aria-disabled="true"`} aria-label="${SOCIAL_NAMES[k] || k}" title="${SOCIAL_NAMES[k] || k}"><img src="${SI}${k}.svg" alt="${SOCIAL_NAMES[k] || k}"></a>`).join("");

  // active link on scroll
  const navLinks = [...document.querySelectorAll("#links a")];
  const spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle("active", a.dataset.id === e.target.id));
  }), { rootMargin:"-45% 0px -50% 0px" });
  NAV.forEach(([id]) => { const s = $(id); if (s) spy.observe(s); });

  // back to top
  addEventListener("scroll", () => $("toTop").classList.toggle("show", scrollY > 600));
  $("toTop").onclick = () => scrollTo({ top:0, behavior:"smooth" });

  // content
  $("name").textContent = PROFILE.name;
  $("roleA").textContent = PROFILE.roleA;
  $("roleB").textContent = PROFILE.roleB;
  $("heroText").textContent = PROFILE.heroText;
  $("heroPhoto").appendChild(img(PROFILE.heroImage, PROFILE.name));
  $("aboutPhoto").appendChild(img(PROFILE.aboutImage, PROFILE.name));
  $("aboutText").innerHTML = PROFILE.about.map(p => `<p>${p}</p>`).join("");
  $("resume").href = PROFILE.resume;

  const roles = [PROFILE.roleB, "Research-minded Builder"];
  let ri = 0;
  setInterval(() => {
    const el = $("roleB"); el.style.opacity = 0;
    setTimeout(() => { ri = (ri + 1) % roles.length; el.textContent = roles[ri]; el.style.opacity = 1; }, 350);
  }, 3000);

  const DI = "https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/icons/";
  $("tiles").innerHTML = SKILLS.map(([n, p]) =>
    `<div class="tile" title="${n}"><img src="${DI}${p}.svg" alt="${n}" onerror="this.style.display='none'"><small>${n}</small></div>`).join("");

  $("expList").innerHTML = EXPERIENCE.map(e => `
    <div class="row"><div class="when">${e.when}</div>
      <div><h3>${e.role} - <em>${e.org}</em></h3><p>${e.text}</p>
      <div class="tags">${e.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></div></div>`).join("");

  $("pubList").innerHTML = PUBLICATIONS.map((p, i) => `
    <div class="pub"><div>
      <div class="head"><span>${String(i + 1).padStart(2, "0")}</span><span class="pill">${p.type}</span></div>
      <h3>${p.title}</h3>
      ${p.authors ? `<div class="auth">${p.authors}</div>` : ""}
      <div class="venue">${p.venue}</div>
      ${p.doi ? `<div class="doi">DOI: ${p.doi}</div>` : ""}
    </div>
    <div class="side"><span>${p.year}</span>${p.link ? `<a class="btn" href="${p.link}" target="_blank" rel="noopener">View Publication ↗</a>` : ""}</div></div>`).join("");

  $("projectList").innerHTML = PROJECTS.map((p, i) => `
    <div class="proj"><div class="thumb" id="th${i}"></div>
      <div><h3>${p.title}
        ${p.live ? `<a class="ic live" href="${p.live}" target="_blank" rel="noopener" title="Live demo">▶</a>` : ""}
        ${p.code ? `<a class="ic" href="${p.code}" target="_blank" rel="noopener" title="Source code">&lt;/&gt;</a>` : ""}
      </h3><p>${p.text}</p>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></div></div>`).join("");
  PROJECTS.forEach((p, i) => $("th" + i).appendChild(img(p.image, p.title)));

  const c = [];
  if (CONTACT.location) c.push(`<li>📍 ${CONTACT.location}</li>`);
  if (CONTACT.phone) c.push(`<li>📞 <a href="tel:${CONTACT.phone}">${CONTACT.phone}</a></li>`);
  if (CONTACT.email) c.push(`<li>✉️ <a href="mailto:${CONTACT.email}">${CONTACT.email}</a></li>`);
  $("contactList").innerHTML = c.join("");
  $("year").textContent = new Date().getFullYear();

  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("show")), { threshold: .08 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
